<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#173d52" />
    <title>Premium Remodel · Offline</title>
    <style>
      body {
        margin: 0;
        background: #f5f7fa;
        color: #173d52;
        font:
          16px/1.6 system-ui,
          sans-serif;
        display: grid;
        min-height: 100svh;
        place-items: center;
      }
      main {
        max-width: 420px;
        padding: 32px;
      }
      h1 {
        font-size: 28px;
        letter-spacing: -0.7px;
      }
      p {
        color: #5d6c78;
      }
      a {
        display: inline-block;
        margin-top: 16px;
        background: #173d52;
        color: white;
        padding: 12px 20px;
        border-radius: 6px;
        text-decoration: none;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0e1720;
          color: #e7edf4;
        }
        p {
          color: #a2b3c3;
        }
        a {
          background: #88bff7;
          color: #0e1720;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <strong>PREMIUM REMODEL</strong>
      <h1>You’re offline</h1>
      <p>
        Reconnect to see projects and send location updates. Your last location
        may still appear on the team map with its update time.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
