name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, build, sample tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Audit production web dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm ci --prefix credits-site
      - name: Audit credits site dependencies
        run: npm audit --omit=dev --audit-level=high --prefix credits-site
      - run: npm run build --prefix credits-site
      - run: npm ci --prefix mobile
      - name: Audit mobile dependencies
        run: node scripts/audit-mobile.mjs
      - run: npm run typecheck --prefix mobile
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm test
        env:
          CI: "1"

  vercel-preview:
    name: Vercel preview
    if: github.event_name == 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Check Vercel secrets
        id: secrets
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel preview skipped. Walker must add GitHub Actions secrets VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID for project servicebuddy-ui."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Install Vercel CLI
        if: steps.secrets.outputs.configured == 'true'
        run: npm install -g vercel@latest
      - name: Pull Vercel env
        if: steps.secrets.outputs.configured == 'true'
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Build preview
        if: steps.secrets.outputs.configured == 'true'
        run: vercel build --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Deploy preview
        if: steps.secrets.outputs.configured == 'true'
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $url"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Comment preview URL
        if: steps.secrets.outputs.configured == 'true' && steps.deploy.outputs.url
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const body = `## Vercel preview\n\n${url}\n\nDo not merge without Walker approval.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) =>
              comment.body?.includes('## Vercel preview'),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  vercel-production:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Apply database migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Install Vercel CLI
        run: npm install -g vercel@64.5.0
      - name: Pull Vercel production settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Build production
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Deploy production
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production URL: $url"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  product-council-preview-evidence:
    name: Product council preview evidence
    if: github.event_name == 'pull_request' && needs.vercel-preview.outputs.url != ''
    needs: [quality, vercel-preview]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          # Run the reporter from the trusted base commit. The PR implementation
          # must never be able to alter code that receives CRON_SECRET.
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Post PR, checks, and preview to the approval gate
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PRODUCT_COUNCIL_REPORT_MODE: preview
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH_NAME: ${{ github.head_ref }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          PREVIEW_RESULT: ${{ needs.vercel-preview.result }}
          PREVIEW_URL: ${{ needs.vercel-preview.outputs.url }}
          WORKFLOW_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/report-product-council.mjs

  product-council-production-evidence:
    name: Product council production evidence
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [quality, vercel-production]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Report production outcome
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PRODUCT_COUNCIL_REPORT_MODE: production
          HEAD_SHA: ${{ github.sha }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          PRODUCTION_RESULT: ${{ needs.vercel-production.result }}
          PRODUCTION_URL: ${{ needs.vercel-production.outputs.url }}
          WORKFLOW_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/report-product-council.mjs

  discord-build-update:
    name: Discord build update
    if: ${{ always() && !cancelled() }}
    needs: [quality, vercel-preview, vercel-production]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      DISCORD_BUILD_WEBHOOK: ${{ secrets.DISCORD_BUILD_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Post build result
        if: env.DISCORD_BUILD_WEBHOOK != ''
        continue-on-error: true
        run: node .github/scripts/notify-build.mjs
        env:
          BUILD_REF: ${{ github.head_ref || github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          PREVIEW_RESULT: ${{ needs.vercel-preview.result }}
          PREVIEW_URL: ${{ needs.vercel-preview.outputs.url }}
          PRODUCTION_RESULT: ${{ needs.vercel-production.result }}
